name: Android authentication app
on:
  push:
    paths: ['new/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['new/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dukaanhq-android-auth
          path: |
            new/android/app/build/outputs/apk/debug/*.apk
            new/android/app/build/reports/tests/testDebugUnitTest/
            new/android/app/build/ui-previews/*.png
          retention-days: 7
