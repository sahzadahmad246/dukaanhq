name: Backend checks
on:
  push:
    paths: ['new/backend/**', 'new/package.json', 'new/bun.lock', 'new/docs/openapi.json', 'web/db/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['new/backend/**', 'new/package.json', 'new/bun.lock', 'new/docs/openapi.json', 'web/db/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: new/backend
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
        working-directory: new
      - run: bun run check
      - run: bun run build
      - run: bun run openapi && git diff --exit-code -- ../docs/openapi.json
